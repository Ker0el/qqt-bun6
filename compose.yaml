services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      PUBLIC_ORIGIN: "https://${GAME_DOMAIN:?Set GAME_DOMAIN in .env}"
    expose:
      - "8787"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      GAME_DOMAIN: "${GAME_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
